<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Warm Orange Brand Gradient -->
    <linearGradient id="muzoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b47" />
      <stop offset="100%" stop-color="#e84e13" />
    </linearGradient>

    <!-- Neumorphic Drop & Reflection Shadow Filter -->
    <filter id="neumorphShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#a3b1c6" flood-opacity="0.6" />
      <feDropShadow dx="-2" dy="-2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Raised Neumorphic Squircle Base -->
  <rect 
    x="5" 
    y="5" 
    width="54" 
    height="54" 
    rx="16" 
    fill="#e0e5ec" 
    filter="url(#neumorphShadow)" 
  />

  <!-- Subtle Inset Highlight Rim -->
  <rect 
    x="6" 
    y="6" 
    width="52" 
    height="52" 
    rx="15" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="1" 
    opacity="0.6" 
  />

  <!-- Stylized Soundwave "M" Logo Mark -->
  <path 
    d="M18 43V23.5a3 3 0 0 1 5.12-2.12L32 30.5l8.88-9.12A3 3 0 0 1 46 23.5V43a3 3 0 0 1-6 0V32.2l-5.88 6.02a3 3 0 0 1-4.24 0L24 32.2V43a3 3 0 0 1-6 0z" 
    fill="url(#muzoGrad)" 
  />

  <!-- High-Energy Audio Accent Dot -->
  <circle cx="32" cy="15" r="2.5" fill="url(#muzoGrad)" />
</svg>